<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor 3D</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><style>html,body{margin:0;height:100%;background:#eeeae5;font-family:Arial,sans-serif}model-viewer{width:100%;height:100%;--poster-color:transparent}.hint{position:absolute;bottom:16px;left:16px;background:#ffffffd9;padding:10px 14px;border-radius:9px;font-size:13px}</style></head><body><model-viewer id="visor" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1" environment-image="neutral" alt="Modelo 3D interactivo"></model-viewer><div class="hint" id="estado">Cargando modelo 3D…</div><script>async function iniciar(){try{const urls=['./modelo_parte1.bin','./modelo_parte2.bin'];const r=await Promise.all(urls.map(u=>fetch(u)));for(const x of r)if(!x.ok)throw Error('No se encontró una parte del modelo');const b=await Promise.all(r.map(x=>x.blob()));const url=URL.createObjectURL(new Blob(b,{type:'model/gltf-binary'}));document.getElementById('visor').src=url;document.getElementById('estado').textContent='Arrastra para girar · Rueda para acercar';}catch(e){document.getElementById('estado').textContent='Error al cargar: '+e.message;}}iniciar();</script></body></html>
